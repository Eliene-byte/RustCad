[package]
name = "rustcad"
version = "0.1.0"
edition = "2021"
description = "AutoCAD-compatible 2D CAD engine written in Rust. Powered by NanoCore — an ultra-lightweight vector geometry kernel (~140 MB binary) for extreme performance on low-end notebooks."
authors = ["Eliene-byte"]
license = "MIT"
repository = "https://github.com/Eliene-byte/RustCad"
keywords = ["cad", "autocad", "dxf", "2d", "engineering", "drawing", "lightweight", "nanocore"]
categories = ["development-tools", "gui"]

[dependencies]
# CLI interativa (tipo linha de comando do AutoCAD)
clap = { version = "4.5", features = ["derive"] }
rustyline = "11.0"

# Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Matemática vetorial e geométrica
glam = "0.24"

# IDs únicos para entidades
uuid = { version = "1.10", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Tratamento de erros
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
